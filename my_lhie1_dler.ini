custom_proxy_group=Netflix`select`[]Proxies`[]美国节点`[]香港节点`[]日本节点`[]新加坡节点`[]DIRECT`[]台湾节点`[]韩国节点`[]其他地区节点
custom_proxy_group=Spotify`select`[]Proxies`[]美国节点`[]香港节点`[]日本节点`[]DIRECT`[]新加坡节点`[]台湾节点`[]韩国节点`[]其他地区节点

custom_proxy_group=Telegram`select`[]Proxies`[]美国节点`[]新加坡节点`[]日本节点`[]DIRECT`[]香港节点`[]台湾节点`[]韩国节点`[]其他地区节点
custom_proxy_group=Steam`select`[]Proxies`[]美国节点`[]新加坡节点`[]香港节点`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点`[]DIRECT
custom_proxy_group=Speedtest`select`[]Proxies`[]美国节点`[]香港节点`[]新加坡节点`[]DIRECT`[]Domestic`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点
custom_proxy_group=PayPal`select`[]DIRECT`[]Proxies`[]美国节点`[]新加坡节点`[]香港节点`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点
custom_proxy_group=Microsoft`select`[]Proxies`[]美国节点`[]新加坡节点`[]香港节点`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点`[]DIRECT
custom_proxy_group=Netease Music`select`[]DIRECT`[]Proxies`[]美国节点`[]香港节点`[]日本节点`[]新加坡节点`[]台湾节点`[]韩国节点`[]其他地区节点`(网易云|解锁)

