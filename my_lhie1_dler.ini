custom_proxy_group=Google FCM`select`[]Proxies`[]美国节点`[]新加坡节点`[]香港节点`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点`[]DIRECT
custom_proxy_group=AI Suite`select`[]Proxies`[]美国节点`[]新加坡节点`[]香港节点`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点`[]DIRECT
custom_proxy_group=miHoYo`select`[]Proxies`[]美国节点`[]新加坡节点`[]香港节点`[]日本节点`[]台湾节点`[]韩国节点`[]其他地区节点`[]DIRECT
custom_proxy_group=Auto - UrlTest`url-test`.*`http://cp.cloudflare.com/generate_204`1800

custom_proxy_group=香港节点`url-test`(港|HK|hk|Hong Kong|HongKong)`http://cp.cloudflare.com/generate_204`300,,50
