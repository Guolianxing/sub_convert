[custom]
# 1. 核心生成开关
enable_rule_generator=true
overwrite_original_rules=true

# 2. 基础配置补丁（解决 OpenClash 兼容性）
# 强制指定监听和 DNS 基础逻辑，防止生成“裸配置”
#config=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_Full_FakeIPv2.ini
#external_controller=127.0.0.1:9090

# ===== 核心规则 (使用 GEOSITE 形式) =====
# 语法说明：GEOSITE,域名类别,策略组名

# ① 基础直连
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOSITE,apple-cn
ruleset=DIRECT,[]GEOSITE,google-cn

# ② AI 
ruleset=AI Suite,[]GEOSITE,openai
ruleset=AI Suite,[]GEOSITE,anthropic
ruleset=AI Suite,[]GEOSITE,chatgpt

# ③ 流媒体
ruleset=Netflix,[]GEOSITE,netflix
ruleset=Spotify,[]GEOSITE,spotify
ruleset=Disney,[]GEOSITE,disney
ruleset=YouTube,[]GEOSITE,youtube
ruleset=Max,[]GEOSITE,hbo

# ④ 常用服务
ruleset=Telegram,[]GEOSITE,telegram
ruleset=Discord,[]GEOSITE,discord
ruleset=Steam,[]GEOSITE,steam

# ⑤ 功能与大厂
ruleset=Microsoft,[]GEOSITE,microsoft
ruleset=Apple,[]GEOSITE,apple
ruleset=PayPal,[]GEOSITE,paypal
ruleset=miHoYo,[]GEOSITE,mihoyo

# ⑥ 代理兜底 (GFWList 包含的国外域名)
ruleset=Proxies,[]GEOSITE,gfw
ruleset=Proxies,[]GEOSITE,geolocation-!cn

# ⑦ 国内优化与兜底
ruleset=Domestic,[]GEOSITE,cn
ruleset=Domestic,[]GEOIP,CN

# ⑧ 最终兜底
ruleset=Others,[]MATCH

# ===== 策略组配置 (保持你原来的分组逻辑) =====
custom_proxy_group=Proxies`select`[]Auto - UrlTest`[]DIRECT`[]香港节点`[]台湾节点`[]日本节点`[]新加坡节点`[]美国节点`[]韩国节点`[]其他地区节点
custom_proxy_group=Domestic`select`[]DIRECT`[]Proxies`[]美国节点`[]香港节点`[]日本节点`[]新加坡节点`[]台湾节点`[]韩国节点`[]其他地区节点
custom_proxy_group=Scholar`select`[]DIRECT`[]Proxies`[]香港节点`[]台湾节点`[]日本节点`[]新加坡节点`[]美国节点`[]韩国节点`[]其他地区节点
custom_proxy_group=Others`select`[]Proxies`[]美国节点`[]香港节点`[]日本节点`[]新加坡节点`[]台湾节点`[]韩国节点`[]其他地区节点`[]DIRECT
custom_proxy_group=Apple`select`[]DIRECT`[]Proxies`[]美国节点`[]香港节点`[]日本节点`[]新加坡节点`[]台湾节点`[]韩国节点`[]其他地区节点
